name: Deploy Production

# Permanent CI-driven deploy that bypasses Vercel's commit-author check.
# Triggers on every push to main and on manual dispatch from the Actions tab.
#
# What this fixes:
#   Vercel's Hobby plan blocks deploys when the commit author email doesn't
#   resolve to a GitHub user with team-member access, and that team membership
#   silently lapses every time the Vercel <-> GitHub OAuth token rotates.
#   This workflow deploys via the Vercel CLI using a long-lived VERCEL_TOKEN,
#   which is not subject to that check.
#
# Required GitHub repository secrets (Settings -> Secrets and variables -> Actions):
#   VERCEL_TOKEN       -> https://vercel.com/account/tokens (create one named "github-actions")
#   VERCEL_ORG_ID      -> Vercel Team Settings -> General -> Team ID (e.g. team_XXXX...)
#   VERCEL_PROJECT_ID  -> chinmayi-gallery project -> Settings -> General -> Project ID (prj_XXXX...)
#
# After adding the secrets:
#   1. Push any commit to main (or click "Run workflow" in the Actions tab).
#   2. The job will build the Next.js app on GitHub's runners and upload the
#      pre-built artifacts to Vercel for production, regardless of who authored
#      the commit.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  # Only one production deploy at a time. Newer pushes cancel an in-flight build.
  group: vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Hard cap so we never see a 52-minute hang again — the whole job will
    # fail fast and surface the problem instead of burning runner minutes.
    timeout-minutes: 15
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      # Skip the chatty prisma 'thank you' prompt; sometimes triggers a
      # wait-for-input on CI which is the most likely cause of long hangs.
      PRISMA_HIDE_UPDATE_MESSAGE: "true"
      CI: "true"
    steps:
      - name: Verify required secrets
        run: |
          missing=0
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is missing. Add it in GitHub repo Settings -> Secrets and variables -> Actions, not only in Vercel."
              missing=1
            fi
          done
          exit "$missing"
        timeout-minutes: 1

      - name: Check out repository
        uses: actions/checkout@v6
        timeout-minutes: 2

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
        timeout-minutes: 2

      - name: Install Vercel CLI (pinned)
        # Pin to a known-good version — `vercel@latest` has hung before
        # when a freshly-released CLI ships a broken postinstall.
        run: npm install --global vercel@50.40.0
        timeout-minutes: 3

      - name: Show deploy tool versions
        run: |
          node --version
          npm --version
          vercel --version
        timeout-minutes: 1

      - name: Pull Vercel project settings (production)
        run: vercel pull --yes --environment=production --token "$VERCEL_TOKEN"
        timeout-minutes: 2

      - name: Build with Vercel
        run: vercel build --prod --token "$VERCEL_TOKEN"
        timeout-minutes: 8

      - name: Deploy prebuilt artifacts to production
        run: vercel deploy --prebuilt --prod --token "$VERCEL_TOKEN"
        timeout-minutes: 12
